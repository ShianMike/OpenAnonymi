[project]
name = "openanonymi-backend"
version = "0.1.3"
description = "Privacy review API"
requires-python = ">=3.11,<3.12"
dependencies = [
  "alembic>=1.13,<2",
  "cryptography>=45,<51",
  "fastapi>=0.115,<1",
  "phonenumbers>=9,<10",
  "psycopg[binary]>=3.2,<4",
  "pwdlib[argon2]>=0.2,<1",
  "pydantic-settings>=2,<3",
  "pypdf>=6.19,<7",
  "python-docx>=1.2,<2",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<2.2",
  "spacy>=3.8,<3.9",
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
  "uvicorn>=0.30,<1",
  "email-validator==2.3.0",
  "segno==1.6.6",
  "fpdf2==2.8.9",
  "uharfbuzz>=0.50,<1",
  "pillow>=11.3,<13",
  "pypdfium2>=4.30,<6",
  "tesserocr==2.10.0",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.uv.sources]
tesserocr = [{ url = "https://github.com/simonflueckiger/tesserocr-windows_build/releases/download/tesserocr-v2.10.0-tesseract-5.5.2/tesserocr-2.10.0-cp311-cp311-win_amd64.whl", marker = "sys_platform == 'win32'" }]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
