              <span class="boot-scan"></span>
            </div>
          </div>
        </div>
        <div class="boot-status" role="status" aria-atomic="true">
          <h1>Opening OpenAnonymi…</h1>
          <p id="startup-message">Preparing a little more privacy for your words.</p>
        </div>
        <button id="startup-retry" class="boot-retry" type="button">Reload this page</button>
