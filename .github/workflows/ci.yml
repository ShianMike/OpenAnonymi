name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Disposable CI database only. Port 5434: the key-rotation test runs only there.
  PRIVACY_REVIEW_TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-only-password@127.0.0.1:5434/review_test

jobs:
  repository_security:
    name: Repository security
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned secret scanner
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  '"$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Public repository boundaries and scanner self-check
        run: python scripts/check_public_repository.py "$RUNNER_TEMP/gitleaks"
      - name: Scan all fetched Git history
        run: '"$RUNNER_TEMP/gitleaks" git --log-opts="--all" --redact --no-banner --config .gitleaks.toml'

  backend_shards:
    name: Backend shard ${{ matrix.shard }} (PostgreSQL 17)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: review_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.10.6"
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Ruff
        run: uv run --locked ruff check app tests migrations ../scripts/run_backend_shard.py
      - name: Migrations render as offline SQL
        env:
          PRIVACY_REVIEW_DATABASE_URL: postgresql+psycopg://schema:schema@localhost/schema
          PRIVACY_REVIEW_ALLOWED_ORIGINS: '["http://localhost:5173"]'
          PRIVACY_REVIEW_ENVIRONMENT: test
        run: uv run --locked alembic upgrade head --sql > "$RUNNER_TEMP/migrations.sql"
      - name: Apply migrations through head
        env:
          PRIVACY_REVIEW_DATABASE_URL: ${{ env.PRIVACY_REVIEW_TEST_DATABASE_URL }}
          PRIVACY_REVIEW_ALLOWED_ORIGINS: '["http://localhost:5173"]'
          PRIVACY_REVIEW_ENVIRONMENT: test
        run: uv run --locked alembic upgrade head
      - name: Tests
        run: uv run --locked python ../scripts/run_backend_shard.py ${{ matrix.shard }}
      - name: OpenAPI schema matches frontend/openapi.json
        run: |
          uv run --locked python -m app.export_openapi ../frontend/openapi.json
          git diff --exit-code -- ../frontend/openapi.json

  backend:
    name: Backend (PostgreSQL 17)
    needs: backend_shards
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: All backend shards passed
        env:
          SHARD_RESULT: ${{ needs.backend_shards.result }}
        run: test "$SHARD_RESULT" = success

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run lint
      - run: npm run build
      - name: Frontend public configuration boundary
        run: python ../scripts/verify_frontend_config.py
      - name: Generated API types match openapi.json
        run: |
          npm run typegen
          git diff --exit-code -- src/api/schema.d.ts

  container:
    name: Backend container smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: review_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build --pull -t openanonymi-api:ci .
      - name: Image runs as a non-root user
        run: test "$(docker run --rm --entrypoint id openanonymi-api:ci -u)" != "0"
      - name: Start in production mode
        run: |
          key="$(docker run --rm --entrypoint python openanonymi-api:ci -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          echo "::add-mask::$key"
          docker run -d --name api --network host \
            --health-interval=5s --health-start-period=5s \
            --memory=512m --memory-swap=512m \
            -v "$GITHUB_WORKSPACE/backend/tests:/app/tests:ro" \
            -e PORT=8080 \
            -e PRIVACY_REVIEW_DATABASE_URL="$PRIVACY_REVIEW_TEST_DATABASE_URL" \
            -e PRIVACY_REVIEW_ALLOWED_ORIGINS='["https://app.example.invalid","https://127.0.0.1:8080"]' \
            -e PRIVACY_REVIEW_ACTIVE_KEY_ID=ci \
            -e PRIVACY_REVIEW_ATTEMPT_SUBJECT_KEY="$key" \
            -e PRIVACY_REVIEW_CONTENT_KEYS="{\"ci\":\"$key\"}" \
            -e PRIVACY_REVIEW_TRUSTED_PROXY_HOPS=1 \
            -e PRIVACY_REVIEW_HTTPS_REDIRECT_ENABLED=true \
            -e PRIVACY_REVIEW_EMAIL_CHECK_DELIVERABILITY=false \
            openanonymi-api:ci
      - name: Wait for the Docker health check
        run: |
          for _ in $(seq 1 60); do
            status="$(docker inspect --format '{{.State.Health.Status}}' api)"
            [ "$status" = healthy ] && break
            [ "$(docker inspect --format '{{.State.Running}}' api)" = true ] || break
            sleep 2
          done
          docker logs api
          test "$status" = healthy
      - name: Health, headers, CORS, cookie, logs and worker count
        run: |
          set -eu
          # Mirror Heroku's overwritten protocol header for loopback container requests.
          curl() { command curl -H 'X-Forwarded-Proto: https' "$@"; }
          base=http://127.0.0.1:8080/api/v1
          origin=https://app.example.invalid
          redirect_headers="$(command curl -sS -D - -o /dev/null -X POST "$base/auth/sign-in" \
            -H 'X-Forwarded-Proto: http' --data 'synthetic-not-json')"
          printf '%s' "$redirect_headers" | grep -q '307 Temporary Redirect'
          printf '%s' "$redirect_headers" | grep -qi 'location: https://127.0.0.1:8080/api/v1/auth/sign-in'
          curl -fsS http://127.0.0.1:8080/ | grep -q 'Content-Security-Policy'
          curl -fsS http://127.0.0.1:8080/documents | grep -q 'id="root"'
          site_headers="$(curl -fsS -D - -o /dev/null http://127.0.0.1:8080/documents)"
          echo "$site_headers" | grep -qi "^content-security-policy: frame-ancestors 'none'"
          echo "$site_headers" | grep -qi '^cache-control: no-store'
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/unknown")" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/assets/missing.js)" = 404
          curl -fsS "$base/health/live" | grep -q '"ok"'
          curl -fsS "$base/health/ready" | grep -q '"ok"'
          headers="$(curl -fsS -D - -o /dev/null "$base/meta?probe=synthetic-query")"
          echo "$headers" | grep -qi '^strict-transport-security: max-age=63072000'
          echo "$headers" | grep -qi '^x-content-type-options: nosniff'
          echo "$headers" | grep -qi '^cache-control: no-store'
          if echo "$headers" | grep -qi '^server:'; then exit 1; fi
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/docs)" = 404
          # The host terminates TLS; noncanonical paths must never redirect to HTTP.
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/meta/")" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST "$base/auth/sign-in/")" = 404
          slash_headers="$(curl -sS -D - -o /dev/null "$base/meta/")"
          if echo "$slash_headers" | grep -qi '^location:'; then exit 1; fi
          docs_headers="$(curl -sS -D - -o /dev/null http://127.0.0.1:8080/docs)"
          echo "$docs_headers" | grep -qi "^content-security-policy: default-src 'none'"
          preflight="$(curl -fsS -D - -o /dev/null -X OPTIONS "$base/auth/sign-in" \
            -H "Origin: $origin" -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type,x-csrf-token')"
          echo "$preflight" | grep -qi "^access-control-allow-origin: $origin"
          echo "$preflight" | grep -qi '^access-control-allow-credentials: true'
          email=ci-smoke@openanonymi.vercel.app
          pw=synthetic-ci-password
          printf '%s\n%s\n%s\n%s\n' "$email" "CI smoke" "$pw" "$pw" | docker exec -i api python -m app.accounts.bootstrap
          signup_status="$(curl -sS -o /tmp/signup-response.json -w '%{http_code}' -X POST "$base/auth/sign-up" \
            -H "Origin: $origin" -H 'Content-Type: application/json' \
            --data "{\"email\":\"$email\",\"password\":\"$pw\",\"workspace_name\":\"CI smoke\"}")"
          test "$signup_status" = 503
          grep -q 'registration_unavailable' /tmp/signup-response.json
          cookie="$(curl -fsS -D - -o /dev/null -X POST "$base/auth/sign-in" \
            -H "Origin: $origin" -H 'Content-Type: application/json' \
            --data "{\"email\":\"$email\",\"password\":\"$pw\"}" \
            | grep -i '^set-cookie:')"
          for attribute in HttpOnly Secure SameSite=None Partitioned Path=/api/v1 Max-Age=43200; do
            echo "$cookie" | grep -qi -- "$attribute"
          done
          docker logs api 2>&1 | grep -q '"GET /api/v1/meta" 200'
          if docker logs api 2>&1 | grep -q 'synthetic-query'; then exit 1; fi
          test "$(curl -s -o /dev/null -w '%{http_code}' -X SYNTHETIC_PRIVATE_METHOD "$base/meta")" = 405
          docker logs api 2>&1 | grep -q '\[unsupported\] /api/v1/meta'
          if docker logs api 2>&1 | grep -q 'SYNTHETIC_PRIVATE_METHOD'; then exit 1; fi
          test "$(docker top api | grep -c 'uvicorn app.main:app')" -eq 1
      - name: Native inventory, Linux limits and warmed NLP/OCR/PDF memory
        run: |
          mkdir -p "$RUNNER_TEMP/native-runtime"
          docker exec -i api python < scripts/verify_container_runtime.py \
            > "$RUNNER_TEMP/native-runtime/report.json" \
            2> "$RUNNER_TEMP/native-runtime/diagnostic.log"
      - name: Retain native runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-runtime
          path: ${{ runner.temp }}/native-runtime/
          if-no-files-found: warn
          retention-days: 14
